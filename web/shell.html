<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorting Algorithms Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f1e8;
      --muted: #a9b0b2;
      --accent: #f2b84b;
      --surface: #182225;
      --background: #0d1416;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background: radial-gradient(circle at 50% 0%, #26373a 0, var(--background) 58%);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(1500px, 100vw);
      height: min(900px, 100vh);
      position: relative;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 500ms ease;
    }

    main.ready canvas { opacity: 1; }

    .welcome {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(135deg, rgb(13 20 22 / 96%), rgb(24 34 37 / 92%));
      transition: opacity 350ms ease, visibility 350ms ease;
    }

    main.ready .welcome {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 5.5rem);
      font-weight: 400;
      line-height: .95;
      letter-spacing: 0;
    }

    .welcome p {
      max-width: 430px;
      margin: 1.25rem auto 2rem;
      color: var(--muted);
      font: 1rem/1.6 system-ui, sans-serif;
    }

    button {
      justify-self: center;
      padding: .85rem 1.6rem;
      border: 1px solid var(--accent);
      border-radius: 2px;
      color: #1d241f;
      background: var(--accent);
      font: 700 .8rem/1 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover { background: #ffd276; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    @media (max-width: 700px) {
      main { height: 100vh; }
      .welcome h1 { font-size: clamp(2.5rem, 13vw, 4.5rem); }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <section class="welcome" aria-label="Welcome">
      <div>
        <h1>Sorting Algorithms</h1>
        <p>Watch classic sorting methods turn a shuffled set of bars into order.</p>
        <button id="start" type="button">Start visualizer</button>
      </div>
    </section>
  </main>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      noInitialRun: true,
      print: function () {},
      printErr: function () {}
    };

    document.getElementById('start').addEventListener('click', function () {
      Module.callMain([]);
      document.getElementById('app').classList.add('ready');
      document.getElementById('canvas').focus();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
